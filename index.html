<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動動腦·身體活動知識挑戰</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
  background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  color: #fff; padding: 20px;
}
.container {
  max-width: 640px; width: 100%; background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px); border-radius: 24px; padding: 32px 28px;
  border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 25px 60px rgba(0,0,0,0.3);
  transition: all 0.3s;
}
.screen { display: none; }
.screen.active { display: block; }

h1 { font-size: 28px; text-align: center; margin-bottom: 6px; font-weight: 800; }
h2 { font-size: 20px; text-align: center; margin-bottom: 20px; font-weight: 600; color: #7ee8d6; }
.subtitle { text-align: center; color: #a0b8c8; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }

input[type=text] {
  width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: #fff; font-size: 18px; outline: none;
  transition: border 0.3s; text-align: center;
}
input[type=text]:focus { border-color: #7ee8d6; }

.btn {
  display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 17px;
  font-weight: 700; cursor: pointer; border: none; transition: all 0.25s;
  margin-top: 14px; letter-spacing: 1px;
}
.btn-primary { background: linear-gradient(135deg, #11998e, #38ef7d); color: #000; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(56,239,125,0.3); }
.btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.btn-secondary:hover { background: rgba(255,255,255,0.18); }

.progress-bar {
  width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px;
  margin-bottom: 20px; overflow: hidden;
}
.progress-fill { height: 100%; background: linear-gradient(90deg, #11998e, #38ef7d); border-radius: 3px; transition: width 0.4s; }

.question-number { font-size: 13px; color: #7ee8d6; margin-bottom: 8px; }
.question-text { font-size: 19px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }

.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04); cursor: pointer; transition: all 0.2s;
  font-size: 16px; position: relative;
}
.option:hover { border-color: #7ee8d6; background: rgba(126,232,214,0.1); }
.option.correct { border-color: #38ef7d; background: rgba(56,239,125,0.2); animation: pulse 0.4s; }
.option.wrong { border-color: #ff4757; background: rgba(255,71,87,0.2); animation: shake 0.4s; }
.option.disabled { pointer-events: none; opacity: 0.85; }

@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.timer { text-align: center; font-size: 14px; color: #a0b8c8; margin-bottom: 12px; }
.feedback {
  text-align: center; padding: 12px; border-radius: 10px; margin: 12px 0;
  font-weight: 700; font-size: 15px; display: none;
}
.feedback.show { display: block; }
.feedback.correct-fb { background: rgba(56,239,125,0.15); color: #38ef7d; }
.feedback.wrong-fb { background: rgba(255,71,87,0.15); color: #ff4757; }

.score-display { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 14px; color: #a0b8c8; }
.score-display span { font-weight: 700; color: #7ee8d6; }

.result-icon { text-align: center; font-size: 64px; margin: 10px 0; }
.result-score { text-align: center; font-size: 48px; font-weight: 800; color: #38ef7d; margin: 8px 0; }
.result-detail { text-align: center; color: #a0b8c8; font-size: 14px; line-height: 1.8; margin-bottom: 16px; }

.leaderboard { margin-top: 20px; }
.leaderboard h3 { font-size: 16px; color: #7ee8d6; margin-bottom: 10px; text-align: center; }
.lb-row {
  display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 8px;
  margin-bottom: 6px; background: rgba(255,255,255,0.04); font-size: 14px;
}
.lb-row:first-child { background: rgba(56,239,125,0.1); border: 1px solid rgba(56,239,125,0.3); }
.lb-name { font-weight: 600; }
.lb-score { color: #38ef7d; font-weight: 700; }

.loading { text-align: center; padding: 20px; color: #a0b8c8; }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #7ee8d6; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.small { font-size: 12px; color: #6a8898; text-align: center; margin-top: 16px; }
/* ====== AI PANEL ====== */
.ai-panel {
  margin: 16px 0; padding: 16px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(102,51,153,0.15), rgba(72,52,212,0.15));
  border: 1px solid rgba(126,232,214,0.2);

.ai-panel h3 { color: #b794f4; font-size: 15px; margin-bottom: 8px; }
.ai-content { font-size: 14px; color: #d0c8e8; line-height: 1.7; white-space: pre-wrap; }
.ai-typing { color: #7ee8d6; font-size: 13px; }
.ai-error { color: #ff6b6b; font-size: 13px; }
/* CHAT */
.chat-modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.chat-box {
  width: 90%; max-width: 500px; max-height: 80vh; background: #1a2a3a;
  border-radius: 18px; border: 1px solid rgba(126,232,214,0.3);
  display: flex; flex-direction: column; overflow: hidden;
}
.chat-header {
  padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; justify-content: space-between; align-items: center;
}
.chat-header span { font-weight: 700; color: #7ee8d6; }
.chat-close { background: none; border: none; color: #a0b8c8; font-size: 20px; cursor: pointer; }
.chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
.chat-msg.ai { background: rgba(72,52,212,0.3); align-self: flex-start; color: #d0c8e8; }
.chat-msg.user { background: rgba(56,239,125,0.2); align-self: flex-end; color: #fff; }
.chat-input-row { padding: 12px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 8px; }
.chat-input-row input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; outline: none; }
.chat-input-row button { padding: 10px 18px; border-radius: 10px; border: none; background: linear-gradient(135deg, #11998e, #38ef7d); color: #000; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="container">

  <!-- START SCREEN -->
  <div id="startScreen" class="screen active">
    <h1>🧠 動動腦</h1>
    <h2>身體活動知識挑戰</h2>
    <p class="subtitle">
      你知道如何聰明地設定運動目標嗎？<br>
      高強度運動真的比較有效嗎？<br>
      來挑戰看看你對身體活動的了解！
    </p>
    <input type="text" id="playerName" placeholder="請輸入你的名字" maxlength="20" autocomplete="off">
    <button class="btn btn-primary" onclick="startGame()">開始挑戰 🚀</button>
    <div class="small">題目來自最新運動科學與健康心理學研究</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">
    <div class="score-display">
      <span>👤 <span id="displayName"></span></span>
      <span>⭐ <span id="currentScore">0</span> 分</span>
      <span>⏱ <span id="currentTimer">00:00</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="question-number" id="questionNumber"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="screen">
    <div class="result-icon" id="resultIcon">🏆</div>
    <h1 id="resultTitle">挑戰完成！</h1>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="leaderboard">
      <h3>🏅 排行榜 TOP 10</h3>
      <div id="leaderboardList"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <button class="btn btn-primary" onclick="restartGame()">再玩一次 🔄</button>
    <button class="btn btn-secondary" onclick="shareResult()">分享結果 📤</button>
    <button class="btn btn-secondary" onclick="openAICoach()" style="background:linear-gradient(135deg,#614385,#516395);color:#fff;">🤖 AI 知識教練</button>
    <div class="ai-panel" id="aiAnalysis" style="display:none">
      <h3>🤖 AI 個人化運動分析</h3>
      <div class="ai-content" id="aiAnalysisContent"><span class="ai-typing">分析中...</span></div>
    </div>
    <div class="small" style="margin-top:20px">資料儲存於 Supabase · AI分析由 Groq 提供</div>
  </div>

</div>

<!-- AI CHAT MODAL -->
<div id="chatModal" class="chat-modal" style="display:none" onclick="if(event.target===this)closeAICoach()">
  <div class="chat-box">
    <div class="chat-header">
      <span>🤖 AI 運動知識教練</span>
      <button class="chat-close" onclick="closeAICoach()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg ai">哈囉！我是你的AI運動知識教練。你可以問我任何關於身體活動、目標設定、運動強度、自我效能等相關問題喔！💪</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="問我任何身體活動的問題..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">發送</button>
    </div>
  </div>
</div>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

// ====== START ======
function startGame() {
  const nameInput = document.getElementById('playerName');
  playerName = nameInput.value.trim();
  if (!playerName) { nameInput.focus(); nameInput.style.borderColor = '#ff4757'; return; }

  questions = shuffle(QUESTION_BANK).slice(0, 10);
  currentQ = 0;
  score = 0;
  correctCount = 0;
  wrongQuestions = [];
  gameActive = true;

  document.getElementById('displayName').textContent = playerName;
  document.getElementById('currentScore').textContent = '0';
  document.getElementById('currentTimer').textContent = '00:00';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('feedback').classList.remove('show', 'correct-fb', 'wrong-fb');

  showScreen('gameScreen');
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
  loadQuestion();
}

function updateTimer() {
  if (!gameActive) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('currentTimer').textContent = formatTime(elapsed);
}

function loadQuestion() {
  if (currentQ >= questions.length) { endGame(); return; }

  const q = questions[currentQ];
  document.getElementById('questionNumber').textContent = `第 ${currentQ + 1} / ${questions.length} 題`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('progressFill').style.width = ((currentQ / questions.length) * 100) + '%';
  document.getElementById('feedback').classList.remove('show', 'correct-fb', 'wrong-fb');

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => selectAnswer(i);
    container.appendChild(div);
  });
}

function selectAnswer(chosen) {
  if (!gameActive) return;
  gameActive = false;

  const q = questions[currentQ];
  const options = document.querySelectorAll('.option');
  const speedBonus = Math.max(0, 15 - Math.floor((Date.now() - startTime) / 1000 / currentQ));

  options.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === q.ans) opt.classList.add('correct');
    if (i === chosen && chosen !== q.ans) opt.classList.add('wrong');
  });

  let points = 0;
  const fb = document.getElementById('feedback');

  if (chosen === q.ans) {
    correctCount++;
    points = 10 + speedBonus;
    score += points;
    fb.className = 'feedback show correct-fb';
    fb.textContent = `✅ 答對了！+${points} 分（含速度加分 +${speedBonus}）`;
  } else {
    fb.className = 'feedback show wrong-fb';
    fb.textContent = `❌ 答錯了！正確答案是：${q.opts[q.ans]}`;
    wrongQuestions.push({
      question: q.q,
      yourAnswer: q.opts[chosen],
      correctAnswer: q.opts[q.ans],
      explanation: q.exp
    });
  }

  document.getElementById('currentScore').textContent = score;

  setTimeout(() => {
    currentQ++;
    gameActive = true;
    document.getElementById('progressFill').style.width = ((currentQ / questions.length) * 100) + '%';
    loadQuestion();
  }, 1800);
}

// ====== END GAME ======
async function endGame() {
  gameActive = false;
  clearInterval(timerInterval);
  const totalTime = Math.floor((Date.now() - startTime) / 1000);

  showScreen('resultScreen');

  let icon = '🏆', title = '太厲害了！';
  if (correctCount >= 8) { icon = '🎉'; title = '你是身體活動達人！'; }
  else if (correctCount >= 5) { icon = '💪'; title = '不錯喔！繼續加油！'; }
  else if (correctCount >= 3) { icon = '📚'; title = '還有很多可以學習的！'; }
  else { icon = '🌱'; title = '沒關係，學習才剛開始！'; }

  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = score + ' 分';
  document.getElementById('resultDetail').innerHTML =
    `👤 ${playerName}<br>` +
    `✅ 答對 ${correctCount} / ${questions.length} 題<br>` +
    `⏱ 花費時間 ${formatTime(totalTime)}<br>` +
    `📊 正確率 ${Math.round(correctCount / questions.length * 100)}%`;

  // Save to Supabase
  await saveResult(totalTime);
  // Load leaderboard
  await loadLeaderboard();
  // Trigger AI analysis
  runAIAnalysis();
}

async function saveResult(totalTime) {
  if (!supabase) { console.warn('Supabase not available, skip save'); return; }
  try {
    const detail = questions.map((q, i) => ({
      question: q.q,
      correct: q.opts[q.ans]
    }));
    await supabase.from('pa_game_records').insert({
      player_name: playerName,
      score: score,
      correct_count: correctCount,
      total_questions: questions.length,
      time_seconds: totalTime,
      answers_detail: detail,
      difficulty: 'normal'
    });
  } catch (e) {
    console.error('Save error:', e);
  }
}

async function loadLeaderboard() {
  const lb = document.getElementById('leaderboardList');
  if (!supabase) {
    lb.innerHTML = '<div style="text-align:center;color:#a0b8c8;padding:10px;">（離線模式）</div>';
    return;
  }
  try {
    const { data, error } = await supabase
      .from('pa_game_records')
      .select('player_name, score, correct_count, total_questions, time_seconds')
      .order('score', { ascending: false })
      .order('time_seconds', { ascending: true })
      .limit(10);

    if (error) throw error;
    if (!data || data.length === 0) {
      lb.innerHTML = '<div style="text-align:center;color:#a0b8c8;padding:10px;">尚無記錄，快來挑戰！</div>';
      return;
    }

    lb.innerHTML = data.map((r, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
      return `<div class="lb-row">
        <span>${medal} <span class="lb-name">${r.player_name}</span></span>
        <span class="lb-score">${r.score}分 (${r.correct_count}/${r.total_questions}) ${formatTime(r.time_seconds)}</span>
      </div>`;
    }).join('');

  } catch (e) {
    console.error('LB error:', e);
    lb.innerHTML = '<div style="text-align:center;color:#a0b8c8;padding:10px;">排行榜載入中...</div>';
  }
}

function restartGame() {
  clearInterval(timerInterval);
  currentQ = 0; score = 0; correctCount = 0; gameActive = false;
  showScreen('startScreen');
  document.getElementById('playerName').value = '';
}

function shareResult() {
  const msg = `🧠 我在「身體活動知識挑戰」中獲得 ${score} 分！\n✅ ${correctCount}/${questions.length} 題正確\n你也來挑戰看看吧！`;
  if (navigator.share) {
    navigator.share({ title: '身體活動知識挑戰', text: msg });
  } else {
    navigator.clipboard.writeText(msg).then(() => alert('結果已複製到剪貼簿！'));
  }
}

// Enter key to start
document.getElementById('playerName').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') startGame();
});

// ====== AI FUNCTIONS (via Supabase Edge Function) ======
async function callGroq(systemPrompt, userMessage) {
  const resp = await fetch(`${SUPABASE_URL}/functions/v1/groq-proxy`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      system: systemPrompt,
      message: userMessage,
      model: 'llama-3.3-70b-versatile',
      max_tokens: 600
    })
  });
  if (!resp.ok) throw new Error('API error');
  const data = await resp.json();
  return data.content || '抱歉，AI暫時無法回應，請稍後再試。';
}

async function runAIAnalysis() {
  const panel = document.getElementById('aiAnalysis');
  const content = document.getElementById('aiAnalysisContent');
  if (wrongQuestions.length === 0) {
    panel.style.display = 'block';
    content.innerHTML = '🎉 你全部答對了！你已經掌握了身體活動的核心知識，繼續保持運動習慣、跟身邊的人分享這些重要觀念吧！';
    return;
  }
  panel.style.display = 'block';
  content.innerHTML = '<span class="ai-typing">🤖 AI 正在分析你的作答...</span>';

  const wrongSummary = wrongQuestions.map((w, i) =>
    `第${i+1}題：${w.question}\n我選了：${w.yourAnswer}\n正確答案：${w.correctAnswer}`
  ).join('\n\n');

  const prompt = `你是一位專業的運動科學與健康心理學專家。以下是一位台灣使用者玩身體活動知識測驗的結果：
- 答對：${correctCount}/${questions.length} 題
- 答錯的題目如下：

${wrongSummary}

請用繁體中文，以溫暖、鼓勵的口吻，給使用者：
1. 一句整體鼓勵（一兩句）
2. 針對他答錯的題目，簡短解釋正確概念（2-3個重點）
3. 給他一個具體的、今天就可以開始做的運動小建議（結合他的知識缺口來建議）
總共控制在200字以內，格式用自然的段落呈現，不要用編號。`;

  try {
    const aiText = await callGroq(
      '你是專業的運動科學與健康心理學專家，擅長用白話、溫暖的方式解釋專業知識。請用繁體中文回應。',
      prompt
    );
    content.textContent = aiText;
  } catch (e) {
    content.innerHTML = '<span class="ai-error">AI 分析暫時不可用，請稍後再試</span>';
  }
}

// ====== AI CHAT COACH ======
function openAICoach() {
  document.getElementById('chatModal').style.display = 'flex';
  document.getElementById('chatInput').focus();
}

function closeAICoach() {
  document.getElementById('chatModal').style.display = 'none';
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  const chatMsgs = document.getElementById('chatMessages');
  chatMsgs.innerHTML += `<div class="chat-msg user">${msg}</div>`;

  // Add loading
  const loadingId = 'loading_' + Date.now();
  chatMsgs.innerHTML += `<div class="chat-msg ai" id="${loadingId}"><span class="ai-typing">思考中...</span></div>`;
  chatMsgs.scrollTop = chatMsgs.scrollHeight;

  const systemPrompt = `你是專業的運動科學與健康心理學專家。你擅長用白話、溫暖的繁體中文解釋身體活動相關知識。
你的知識領域包括：
- 身體活動與健康（全球PA不足現況、WHO建議）
- 目標設定理論（Locke & Latham）、SMART目標、學習型目標（Seijts & Latham）
- 運動強度（LPA/MPA/VPA）、Biswas強度換算、VILPA概念
- 雙模理論（Dual Mode Theory, Ekkekakis 2003）、情感與運動堅持
- 自我效能理論（Bandura）、向上螺旋理論（Cappellen）
- 運動補償效應（Gay 2017）
- 上班族久坐與健康
請以200字以內簡潔回答，給出實用建議。若問題超出範圍，禮貌告知專注領域。`;

  try {
    const reply = await callGroq(systemPrompt, msg);
    document.getElementById(loadingId).innerHTML = reply;
  } catch (e) {
    document.getElementById(loadingId).innerHTML = '<span class="ai-error">AI 暫時無法回應</span>';
  }
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}
